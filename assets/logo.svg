<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Skill Bill logo: a katana slicing through code brackets">
  <title>Skill Bill</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="96"/></clipPath>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9eaee"/>
      <stop offset="1" stop-color="#a9adb8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#FFD60A"/>
    <!-- tracksuit stripes -->
    <rect x="30" y="0" width="22" height="512" fill="#111"/>
    <rect x="62" y="0" width="7" height="512" fill="#111"/>
    <!-- faint scanlines -->
    <g stroke="#111" stroke-opacity="0.06" stroke-width="2">
      <path d="M0 96H512M0 192H512M0 288H512M0 384H512M0 480H512"/>
    </g>
  </g>

  <!-- code brackets -->
  <g fill="none" stroke="#111" stroke-width="40" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M168 150 L102 256 L168 362"/>
    <path d="M400 150 L466 256 L400 362"/>
  </g>

  <!-- the sword is the slash in </> -->
  <g transform="translate(272 262) rotate(25) scale(1.1)">
    <!-- red cut trail + flying fragments of malicious code -->
    <path d="M-30 -10 L-22 -10 L-22 238 L-30 262 Z" fill="#E10600"/>
    <path d="M-22 40 L-14 40 L-14 238 L-22 238 Z" fill="#E10600" opacity="0.45"/>
    <g fill="#E10600">
      <rect x="-64" y="150" width="15" height="15" transform="rotate(18 -57 157)"/>
      <rect x="-86" y="196" width="11" height="11" transform="rotate(-12 -80 201)"/>
      <rect x="-58" y="224" width="9" height="9"/>
      <rect x="-104" y="132" width="8" height="8" transform="rotate(30 -100 136)"/>
    </g>

    <!-- blade -->
    <path d="M-12 -70 H12 V172 L-12 206 Z" fill="url(#steel)" stroke="#111" stroke-width="7" stroke-linejoin="miter"/>
    <path d="M-2 -60 V168" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M6 -58 V160" stroke="#8b8f9a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- tsuba (guard) -->
    <rect x="-38" y="-88" width="76" height="20" rx="8" fill="#111" stroke="#FFD60A" stroke-width="3"/>
    <rect x="-14" y="-94" width="28" height="8" rx="3" fill="#111"/>

    <!-- handle with wrap pattern -->
    <rect x="-12" y="-214" width="24" height="128" fill="#111"/>
    <g stroke="#FFD60A" stroke-width="3" fill="none" stroke-linejoin="miter">
      <path d="M-12 -204 L0 -192 L12 -204"/>
      <path d="M-12 -184 L0 -172 L12 -184"/>
      <path d="M-12 -164 L0 -152 L12 -164"/>
      <path d="M-12 -144 L0 -132 L12 -144"/>
      <path d="M-12 -124 L0 -112 L12 -124"/>
      <path d="M-12 -104 L0 -92 L12 -104"/>
    </g>
    <rect x="-16" y="-228" width="32" height="16" rx="5" fill="#111"/>
  </g>
</svg>
