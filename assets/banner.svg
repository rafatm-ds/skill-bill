<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Skill Bill: slash the malicious, keep the skills">
  <title>Skill Bill</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="96"/></clipPath>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9eaee"/>
      <stop offset="1" stop-color="#a9adb8"/>
    </linearGradient>
    <symbol id="icon" viewBox="0 0 512 512">
      <g clip-path="url(#tile)">
        <rect width="512" height="512" fill="#FFD60A"/>
        <rect x="30" y="0" width="22" height="512" fill="#111"/>
        <rect x="62" y="0" width="7" height="512" fill="#111"/>
        <g stroke="#111" stroke-opacity="0.06" stroke-width="2"><path d="M0 96H512M0 192H512M0 288H512M0 384H512M0 480H512"/></g>
      </g>
      <g fill="none" stroke="#111" stroke-width="40" stroke-linejoin="miter" stroke-linecap="square">
        <path d="M168 150 L102 256 L168 362"/>
        <path d="M400 150 L466 256 L400 362"/>
      </g>
      <g transform="translate(272 262) rotate(25) scale(1.1)">
        <path d="M-30 -10 L-22 -10 L-22 238 L-30 262 Z" fill="#E10600"/>
        <path d="M-22 40 L-14 40 L-14 238 L-22 238 Z" fill="#E10600" opacity="0.45"/>
        <g fill="#E10600">
          <rect x="-64" y="150" width="15" height="15" transform="rotate(18 -57 157)"/>
          <rect x="-86" y="196" width="11" height="11" transform="rotate(-12 -80 201)"/>
          <rect x="-58" y="224" width="9" height="9"/>
          <rect x="-104" y="132" width="8" height="8" transform="rotate(30 -100 136)"/>
        </g>
        <path d="M-12 -70 H12 V172 L-12 206 Z" fill="url(#steel)" stroke="#111" stroke-width="7"/>
        <path d="M-2 -60 V168" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <path d="M6 -58 V160" stroke="#8b8f9a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        <rect x="-38" y="-88" width="76" height="20" rx="8" fill="#111" stroke="#FFD60A" stroke-width="3"/>
        <rect x="-14" y="-94" width="28" height="8" rx="3" fill="#111"/>
        <rect x="-12" y="-214" width="24" height="128" fill="#111"/>
        <g stroke="#FFD60A" stroke-width="3" fill="none">
          <path d="M-12 -204 L0 -192 L12 -204"/><path d="M-12 -184 L0 -172 L12 -184"/>
          <path d="M-12 -164 L0 -152 L12 -164"/><path d="M-12 -144 L0 -132 L12 -144"/>
          <path d="M-12 -124 L0 -112 L12 -124"/><path d="M-12 -104 L0 -92 L12 -104"/>
        </g>
        <rect x="-16" y="-228" width="32" height="16" rx="5" fill="#111"/>
      </g>
    </symbol>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#111"/>
  <g stroke="#FFD60A" stroke-opacity="0.07" stroke-width="2"><path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/></g>
  <!-- tracksuit stripes along the bottom -->
  <rect x="0" y="560" width="1280" height="34" fill="#FFD60A"/>
  <rect x="0" y="604" width="1280" height="9" fill="#FFD60A"/>

  <!-- icon -->
  <use href="#icon" x="70" y="70" width="440" height="440"/>

  <!-- wordmark, drawn as shapes so it renders the same everywhere -->
  <g fill="#FFD60A" stroke="none">
    <!-- SKILL -->
    <g transform="translate(570 118)">
      <!-- S -->
      <path d="M100 13 H13 V70 H87 V127 H0" fill="none" stroke="#FFD60A" stroke-width="26" stroke-linejoin="miter"/>
      <!-- K -->
      <g transform="translate(124 0)">
        <rect x="0" y="0" width="26" height="140"/>
        <path d="M26 66 L74 0 H112 L54 76 Z"/>
        <path d="M54 64 L112 140 H74 L26 78 V66 Z"/>
      </g>
      <!-- I -->
      <g transform="translate(260 0)">
        <rect x="0" y="0" width="70" height="26"/><rect x="22" y="0" width="26" height="140"/><rect x="0" y="114" width="70" height="26"/>
      </g>
      <!-- L -->
      <g transform="translate(354 0)"><rect x="0" y="0" width="26" height="140"/><rect x="0" y="114" width="92" height="26"/></g>
      <!-- L -->
      <g transform="translate(470 0)"><rect x="0" y="0" width="26" height="140"/><rect x="0" y="114" width="92" height="26"/></g>
    </g>
    <!-- BILL -->
    <g transform="translate(570 292)">
      <!-- B -->
      <path d="M13 13 H72 Q94 13 94 36 Q94 70 72 70 H13 M13 70 H76 Q100 70 100 104 Q100 127 76 127 H13 M13 0 V140" fill="none" stroke="#FFD60A" stroke-width="26" stroke-linejoin="miter"/>
      <g transform="translate(124 0)">
        <rect x="0" y="0" width="70" height="26"/><rect x="22" y="0" width="26" height="140"/><rect x="0" y="114" width="70" height="26"/>
      </g>
      <g transform="translate(218 0)"><rect x="0" y="0" width="26" height="140"/><rect x="0" y="114" width="92" height="26"/></g>
      <g transform="translate(334 0)"><rect x="0" y="0" width="26" height="140"/><rect x="0" y="114" width="92" height="26"/></g>
    </g>
  </g>

  <!-- katana cut across the wordmark -->
  <path d="M556 280 L1170 259 L1170 271 L556 292 Z" fill="#E10600"/>
  <rect x="1124" y="236" width="14" height="14" fill="#E10600" transform="rotate(15 1131 243)"/>
  <rect x="1152" y="226" width="9" height="9" fill="#E10600"/>
  <rect x="1182" y="272" width="10" height="10" fill="#E10600" transform="rotate(-20 1187 277)"/>

  <!-- tagline -->
  <text x="574" y="528" font-family="'Courier New', Consolas, monospace" font-weight="700" font-size="30" fill="#F4F4F4" letter-spacing="0">Slash the malicious. <tspan fill="#FFD60A">Keep the skills.</tspan></text>
</svg>
